services:
  nginx_gateway:
    container_name: nginx_gateway
    image: nginx:1.25.5
    restart: always
    volumes:
      - ./infra/configs/nginx_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/configs/nginx_gateway/site.conf:/etc/nginx/conf.d/site.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - ../web:/data/web:ro
      - ./certs/gateway/server.pem:/etc/nginx/certs/server.pem:ro
      - ./certs/gateway/server.key:/etc/nginx/certs/server.key:ro
    ports:
      - "0.0.0.0:80:80"    # HTTP -> redirect to HTTPS
      - "0.0.0.0:443:443"  # HTTPS (TLS termination)
