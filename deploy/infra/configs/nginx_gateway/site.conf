server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root /data;

    location /auth/ {
        proxy_pass http://nginx_auth;
    }
    location /messenger/ {
        proxy_pass http://nginx_messenger;
    }
    location = / {
        default_type text/plain;
        return 200 "friendsyashki gateway";
    }
    location / {
        return 404;
    }

    error_page   404              /404.html;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
