syntax = "proto3";


message GetUserInfoByTokenRequest {
  string access_token = 1;
}

message GetUserInfoByTokenResponse {
    string id = 1;
}


message GetUserByLoginRequest {
  string login = 1;
}

message GetUserByLoginResponse {
  string id = 1;
}


service User {
  rpc GetUserInfoByToken (GetUserInfoByTokenRequest) returns (GetUserInfoByTokenResponse) {}
  rpc GetUserByLogin (GetUserByLoginRequest) returns (GetUserByLoginResponse) {}
}
